name: NiaSave CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run Operation Polo self-test
        run: npm test

      - name: Run Bison and staff-gate tests
        run: npm run test:bison

      - name: Run Tanot insight-engine tests
        run: npm run test:tanot

      - name: Run storage tests
        run: npm run test:storage

      - name: Build production artifact
        run: npm run build:production
