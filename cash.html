<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NiaSave · Money in</title>
<link rel="stylesheet" href="/staff.css">
</head>
<body>
  <div class="narrow">
    <div class="narrow-card">
      <div class="kicker">Rabbit · staff</div>
      <h1>Open on a laptop</h1>
      <p>Money in is a wide staff desk. It is not the member app.</p>
    </div>
  </div>
  <div class="tower">
    <header class="top">
      <div>
        <div class="brand">Rabbit · cash</div>
        <h1>Money in</h1>
      </div>
      <div class="meta"><a href="/ops.html">Ops</a></div>
    </header>
    <div class="wrap">
      <p class="sub">Finance · staff sample only · no live UPI · no Razorpay</p>
      <p class="sub" id="beat">Beat …</p>
      <button type="button" onclick="load()">Refresh</button>
      <div class="msg" id="msg"></div>
      <div id="list" class="empty">Loading…</div>
    </div>
  </div>
<script>
function lineText(lines){
  return (lines||[]).map(function(l){ return (l.id||'?')+' × '+(l.qty||1); }).join(' · ');
}
function load(){
  var el=document.getElementById('list');
  el.textContent='Loading…';
  fetch('/api/cash?beat=today').then(function(r){ return r.json(); }).then(function(d){
    document.getElementById('beat').textContent='Beat '+(d.beatDate||'-');
    var orders=d.orders||[];
    if(!orders.length){ el.innerHTML='<div class="empty">No reserved or collected bags this beat.</div>'; return; }
    el.innerHTML=orders.map(function(o,i){
      var method=o.method||'cash';
      return '<div class="row" data-i="'+i+'">'
        + '<div class="who">'+(o.member||o.phone||'-')+' · '+(o.status||'')+'</div>'
        + '<div class="meta">'+(o.id||'')+' · due Rs '+(o.due||0)+' · paid Rs '+(o.paid||0)+(o.date?' · '+o.date:'')+'</div>'
        + '<div class="skus">'+lineText(o.lines)+'</div>'
        + '<div class="actions">'
        +   '<span>Rs '+(o.amount||0)+'</span>'
        +   '<select data-field="method"><option value="cash"'+(method==='cash'?' selected':'')+'>cash</option><option value="upi"'+(method==='upi'?' selected':'')+'>upi</option></select>'
        +   '<input type="text" data-field="upiRef" placeholder="UPI ref" value="'+(o.upiRef||'').replace(/"/g,'&quot;')+'">'
        +   '<button type="button" onclick="saveRow('+i+')">Save</button>'
        + '</div></div>';
    }).join('');
    window.__cashOrders=orders;
  }).catch(function(){ el.innerHTML='<div class="empty">Could not load cash board.</div>'; });
}
function saveRow(i){
  var o=(window.__cashOrders||[])[i];
  if(!o) return;
  var row=document.querySelector('.row[data-i="'+i+'"]');
  var method=row.querySelector('[data-field="method"]').value;
  var upiRef=row.querySelector('[data-field="upiRef"]').value;
  fetch('/api/cash',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({ orderId:o.id, method:method, upiRef:upiRef, amount:o.amount })
  }).then(function(r){ return r.json().then(function(j){ return {ok:r.ok,j:j}; }); })
    .then(function(res){
      document.getElementById('msg').textContent=res.ok?'Saved · '+(res.j.cash&&res.j.cash.method):((res.j&&res.j.error)||'Save failed');
      if(res.ok) load();
    });
}
load();
</script>
</body>
</html>
