<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F6F8FB">
<title>NiaSave · Money in</title>
<link rel="icon" href="/assets/nia-logo.png" type="image/png">
<link rel="apple-touch-icon" href="/assets/nia-logo.png">
<link rel="stylesheet" href="/staff.css">
</head>
<body>
  <div class="narrow">
    <div class="narrow-card">
      <div class="kicker">Operation Polo</div>
      <h1>Open on a laptop</h1>
      <p>Money in is a wide staff desk. It is not the member app.</p>
    </div>
  </div>
  <div class="tower">
    <header class="top">
      <div class="mark">
        <img class="nia-logo" src="/assets/nia-logo.png" alt="Nia">
        <div class="brand">Operation Polo</div>
        <div class="desk-head">
          <svg class="desk-icon" viewBox="0 0 40 40" width="40" height="40" aria-hidden="true"><rect x="6" y="12" width="28" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="20" cy="20" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10 16h4M26 24h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <h1>Money in</h1>
        </div>
      </div>
      <div class="meta"><a href="/ops.html">Ops</a></div>
    </header>
    <div class="wrap">
      <p class="sub">Finance · staff sample only · no live UPI · no Razorpay · one stop at a time</p>
      <p class="sub" id="beat">Beat …</p>
      <button type="button" onclick="loadStops()">Refresh stops</button>
      <div class="msg" id="msg"></div>
      <div id="stops" class="stops"></div>
      <div id="list" class="empty">Tap a stop.</div>
    </div>
  </div>
<script>
var STOP='';
function lineText(lines){
  return (lines||[]).map(function(l){ return (l.id||'?')+' × '+(l.qty||1); }).join(' · ');
}
function stopBtn(s, on){
  return '<button type="button" class="stop'+(on?' on':'')+'" data-stop="'+s.stopId+'">'
    + '<div class="stop-id">'+s.stopId+'</div>'
    + '<strong>'+(s.name||s.stopId)+'</strong>'
    + '<div class="stop-num">'+s.collected+' collected · '+s.open+' open</div>'
    + '</button>';
}
function faceStops(d){
  var stops=d.stops||[];
  document.getElementById('stops').innerHTML=stops.map(function(s){
    return stopBtn(s, s.stopId===STOP);
  }).join('');
  document.querySelectorAll('button.stop').forEach(function(el){
    el.addEventListener('click', function(){ pickStop(el.getAttribute('data-stop')); });
  });
}
function pickStop(id){
  if(STOP===id){ STOP=''; document.getElementById('list').innerHTML='<div class="empty">Tap a stop.</div>'; faceStops(window.__cash||{}); return; }
  STOP=id;
  faceStops(window.__cash||{});
  loadStop(id);
}
function loadStop(stop){
  var el=document.getElementById('list');
  el.textContent='Loading '+stop+'…';
  fetch('/api/cash?beat=today&stop='+encodeURIComponent(stop)).then(function(r){ return r.json(); }).then(function(d){
    var orders=d.orders||[];
    if(!orders.length){ el.innerHTML='<div class="empty">No reserved or collected bags at this stop.</div>'; return; }
    el.innerHTML=orders.map(function(o,i){
      var method=o.method||'cash';
      return '<div class="row" data-i="'+i+'">'
        + '<div class="who">'+(o.member||o.phone||'-')+' · '+(o.status||'')+'</div>'
        + '<div class="meta">'+(o.id||'')+' · due Rs '+(o.due||0)+' · paid Rs '+(o.paid||0)+(o.date?' · '+o.date:'')+'</div>'
        + '<div class="skus">'+lineText(o.lines)+'</div>'
        + '<div class="actions">'
        +   '<span>Rs '+(o.amount||0)+'</span>'
        +   '<select data-field="method"><option value="cash"'+(method==='cash'?' selected':'')+'>cash</option><option value="upi"'+(method==='upi'?' selected':'')+'>upi</option></select>'
        +   '<input type="text" data-field="upiRef" placeholder="UPI ref" value="'+(o.upiRef||'').replace(/"/g,'&quot;')+'">'
        +   '<button type="button" onclick="saveRow('+i+')">Save</button>'
        + '</div></div>';
    }).join('');
    window.__cashOrders=orders;
  }).catch(function(){ el.innerHTML='<div class="empty">Could not load this stop.</div>'; });
}
function loadStops(){
  fetch('/api/cash?beat=today').then(function(r){ return r.json(); }).then(function(d){
    window.__cash=d;
    document.getElementById('beat').textContent=(d.theatre||'Rajputana Theatre')+' · Beat '+(d.beatDate||'-')+' · collected '+(d.collectedCount||0)+' · due Rs '+(d.dueToday||0);
    faceStops(d);
    if(STOP) loadStop(STOP);
  }).catch(function(){ document.getElementById('list').innerHTML='<div class="empty">Could not load cash board.</div>'; });
}
function saveRow(i){
  var o=(window.__cashOrders||[])[i];
  if(!o) return;
  var row=document.querySelector('.row[data-i="'+i+'"]');
  var method=row.querySelector('[data-field="method"]').value;
  var upiRef=row.querySelector('[data-field="upiRef"]').value;
  fetch('/api/cash',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({ orderId:o.id, method:method, upiRef:upiRef, amount:o.amount })
  }).then(function(r){ return r.json().then(function(j){ return {ok:r.ok,j:j}; }); })
    .then(function(res){
      document.getElementById('msg').textContent=res.ok?'Saved · '+(res.j.cash&&res.j.cash.method):((res.j&&res.j.error)||'Save failed');
      if(res.ok) loadStop(STOP);
    });
}
loadStops();
</script>
</body>
</html>
