<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F6F8FB">
<title>2 Para</title>
<link rel="icon" href="./assets/nia-logo.png" type="image/png">
<link rel="stylesheet" href="./staff.css">
<style>
  :root { --nia-blue:#2C5880; --nia-blue-deep:#1C3F5C; --nia-blue-soft:#6A8CAE; }
  body { min-height:100vh; background:#F6F8FB; }
  .ops-home { max-width:1240px; margin:0 auto; padding:40px 32px 64px; }
  .ops-head { display:flex; align-items:flex-end; justify-content:space-between; gap:32px; margin:0 0 32px; }
  .ops-title { display:flex; align-items:center; gap:16px; }
  .ops-title .mark { flex:0 0 auto; }
  .ops-home h1 { margin:0; font-size:34px; line-height:1; letter-spacing:-.035em; }
  .ops-intro { margin:0; color:#5B6574; font-size:17px; text-align:right; }
  .ops-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:24px; }
  .ops-card {
    position:relative; display:flex; flex-direction:column; width:100%; min-height:430px;
    text-align:left; background:#fff; border:1px solid #D0D7E0; border-radius:22px;
    padding:40px; cursor:pointer; color:#161B24; overflow:hidden; text-decoration:none;
    transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease;
  }
  .ops-card:hover { transform:translateY(-3px); border-color:var(--card-color); box-shadow:0 18px 42px rgba(28,63,92,.10); text-decoration:none; }
  .ops-card:focus-visible { outline:3px solid rgba(44,88,128,.25); outline-offset:3px; }
  .ops-card[data-id="polo"] { --card-color:var(--nia-blue); --mark-bg:rgba(44,88,128,.09); }
  .ops-card[data-id="bison"] { --card-color:var(--nia-blue-deep); --mark-bg:rgba(28,63,92,.09); }
  .product-mark { display:grid; place-items:center; width:120px; height:120px; border-radius:28px; background:var(--mark-bg); margin:0 0 auto; }
  .product-mark img { display:block; width:88px; height:88px; }
  .product-kind { display:block; margin:36px 0 8px; color:var(--card-color); font-size:15px; font-weight:600; letter-spacing:.02em; }
  .ops-card strong { display:block; font-size:52px; line-height:1; letter-spacing:-.045em; color:#161B24; margin:0 0 14px; font-weight:700; }
  .ops-card p { margin:0; color:#5B6574; font-size:18px; line-height:1.5; max-width:390px; }
  .product-flow { display:flex; align-items:center; justify-content:space-between; gap:18px; margin-top:32px; padding-top:22px; border-top:1px solid #E4E9F1; color:#394657; font-size:15px; }
  .product-flow span:first-child { line-height:1.45; }
  .product-arrow { flex:0 0 auto; color:var(--card-color); font-size:28px; line-height:1; transition:transform .18s ease; }
  .ops-card:hover .product-arrow { transform:translateX(4px); }
  @media (prefers-reduced-motion:reduce){ .ops-card,.product-arrow { transition:none; } }
  @media (max-width:760px){
    .ops-home { padding:28px 20px 48px; }
    .ops-head { align-items:flex-start; flex-direction:column; gap:14px; margin-bottom:24px; }
    .ops-intro { text-align:left; }
    .ops-grid { grid-template-columns:1fr; gap:18px; }
    .ops-card { min-height:330px; padding:28px; }
    .product-mark { width:96px; height:96px; border-radius:24px; }
    .product-mark img { width:70px; height:70px; }
    .product-kind { margin-top:28px; }
    .ops-card strong { font-size:44px; }
  }
</style>
</head>
<body>
  <div class="ops-home">
    <header class="ops-head">
      <div class="ops-title">
        <div class="mark"><img class="nia-logo" src="./assets/nia-logo.png" alt="Nia" width="40" height="40"></div>
        <h1>2 Para</h1>
      </div>
      <p class="ops-intro">One operating room. Two desks.</p>
    </header>
    <div class="ops-grid">
      <a class="ops-card" data-id="polo" href="./ops.html">
        <span class="product-mark"><img src="./assets/polo-mark.svg" alt="" aria-hidden="true"></span>
        <span class="product-kind">Save</span>
        <strong>Polo</strong>
        <p>Move every bag from plan to collection.</p>
        <span class="product-flow"><span>Plan → pack → deliver → collect</span><span class="product-arrow" aria-hidden="true">→</span></span>
      </a>
      <a class="ops-card" data-id="bison" href="./bison.html">
        <span class="product-mark"><img src="./assets/bison-mark.svg" alt="" aria-hidden="true"></span>
        <span class="product-kind">Living</span>
        <strong>Bison</strong>
        <p>Run every member contract, studio and nest.</p>
        <span class="product-flow"><span>Contract → assign → clock → collect</span><span class="product-arrow" aria-hidden="true">→</span></span>
      </a>
    </div>
  </div>
</body>
</html>
