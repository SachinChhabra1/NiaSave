<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F6F8FB">
<title>NiaSave · Predict</title>
<link rel="icon" href="/assets/nia-logo.png" type="image/png">
<link rel="apple-touch-icon" href="/assets/nia-logo.png">
<link rel="stylesheet" href="/staff.css">
<style>
  th,td{text-align:left}
  td.num,th.num{text-align:right}
</style>
</head>
<body>
  <div class="narrow">
    <div class="narrow-card">
      <div class="kicker">Operation Polo</div>
      <h1>Open on a laptop</h1>
      <p>Predict is a wide staff desk. It is not the member app.</p>
    </div>
  </div>
  <div class="tower">
    <header class="top">
      <div class="mark">
        <img class="nia-logo" src="/assets/nia-logo.png" alt="Nia">
        <svg class="polo-icon" viewBox="0 0 40 40" width="36" height="36" aria-hidden="true"><circle cx="9" cy="31" r="3.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M11.4 28.8L30 8" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M26.5 4.8l9.2 2.4-2.6 6.6-9.2-2.4z" fill="currentColor"/></svg>
        <div class="brand">Operation Polo</div>
        <div class="desk-head">
          <svg class="desk-icon" viewBox="0 0 40 40" width="40" height="40" aria-hidden="true"><path d="M8 32V20h6v12H8zM17 32V12h6v20h-6zM26 32V16h6v16h-6z" fill="none" stroke="currentColor" stroke-width="2"/></svg>
          <h1>From the ledger</h1>
        </div>
      </div>
      <div class="meta"><a href="/ops.html">Ops</a> · <a href="/hub.html">Hub load</a></div>
    </header>
    <div class="wrap">
      <p class="sub">Staff only · numbers decide · slot 17:00 · owner hub · not discretion</p>
      <p class="sub" id="beat">…</p>
      <p class="sub" id="from">…</p>
      <button type="button" onclick="load()">Refresh</button>
      <div id="root">Loading…</div>
    </div>
  </div>
<script>
function fromLabel(d){
  var p=d.sheetFrom&&d.sheetFrom.procure?d.sheetFrom.procure:'No file yet';
  var m=d.sheetFrom&&d.sheetFrom.members?d.sheetFrom.members:'From sheet';
  if(p.indexOf('down')>=0||m.indexOf('down')>=0) return 'Sheet down · staff inbound';
  if(p==='No file yet') return 'Procure · no file yet';
  return 'Procure · '+p;
}
function table(cols, rows, empty){
  if(!rows.length) return '<div class="empty">'+empty+'</div>';
  var head=cols.map(function(c){ return '<th'+(c.num?' class="num"':'')+'>'+c.label+'</th>'; }).join('');
  var body=rows.map(function(r){
    return '<tr>'+cols.map(function(c){
      var v=r[c.key];
      return '<td'+(c.num?' class="num"':'')+'>'+(c.raw?v:(v==null?'-':String(v)))+'</td>';
    }).join('')+'</tr>';
  }).join('');
  return '<table><thead><tr>'+head+'</tr></thead><tbody>'+body+'</tbody></table>';
}
function section(title, html){ return '<h2>'+title+'</h2>'+html; }
function load(){
  document.getElementById('root').textContent='Loading…';
  fetch('/api/predict').then(function(r){ return r.json(); }).then(function(d){
    document.getElementById('beat').textContent=(d.theatre||'Rajputana Theatre')+' · '+(d.stopCount||40)+' stops · '+(d.memberCount||3000)+' members · Beat '+(d.beatDate||'-')+' · miss_rate '+(d.miss_rate!=null?d.miss_rate+'%':'-');
    document.getElementById('from').textContent=fromLabel(d);
    var html='';
    var g=d.gates||{};
    var keys=['participation','sellThrough','preorderFill','memberSaving','inventoryLoss','contribution'];
    var labels={
      participation:'Participation (proposed 30/100)',
      sellThrough:'Sell-through (proposed 80/100)',
      preorderFill:'Pre-order fill (proposed 95/100)',
      memberSaving:'Member saving (proposed 3/100)',
      inventoryLoss:'Inventory loss (proposed under 1/200)',
      contribution:'Contribution (proposed 3/100)'
    };
    html+=section('Gates (proposed)', '<p class="sub">Report only. Numerator and denominator. Thresholds stay proposed. This desk does not invent a percent.</p><div id="gates">'
      +keys.map(function(key){
        var row=g[key]||{};
        return '<div class="check"><div class="l">'+labels[key]+'</div><div class="n">'+(row.num!=null?row.num:'-')+' / '+(row.den!=null?row.den:'-')+'</div><div class="l">'+(row.label||'')+'</div></div>';
      }).join('')
      +'</div>');
    html+=section('Tomorrow load', table(
      [{label:'SKU',key:'sku'},{label:'Collected',key:'collected',num:true},{label:'Reserved',key:'reserved',num:true},{label:'miss_rate',key:'miss_rate',num:true},{label:'Qty',key:'tomorrow_qty',num:true},{label:'Why',key:'why',raw:true}],
      (d.load||[]).map(function(r){ return { sku:r.sku, collected:r.collected, reserved:r.reserved, miss_rate:r.miss_rate, tomorrow_qty:r.tomorrow_qty, why:'<span class="why">'+r.why+'</span>' }; }),
      'Nothing to load.'
    ));
    html+=section('Members sample · '+(d.memberCount||3000)+' on the book', table(
      [{label:'Member',key:'memberId'},{label:'Nest',key:'nest'},{label:'Hub',key:'hub'},{label:'Bag',key:'hasBag'},{label:'Mira',key:'hasMira'},{label:'Send',key:'friday_send'}],
      (d.members||[]).map(function(r){ return { memberId:r.memberId, nest:r.nest||'-', hub:r.hub||'-', hasBag:r.hasBag?'yes':'no', hasMira:r.hasMira?'yes':'no', friday_send:r.friday_send||'-' }; }),
      'No member sample.'
    ));
    html+=section('Chase sample · '+(d.chaseCount||0)+' still on the beat', table(
      [{label:'Code',key:'code'},{label:'Status',key:'status'},{label:'Why',key:'why',raw:true}],
      (d.chase||[]).map(function(r){ return { code:'<code>'+(r.pickupCode||'-')+'</code>', status:r.status, why:'<span class="why">'+r.why+'</span>' }; }),
      'No chase rows.'
    ));
    html+=section('Quiet sample · '+(d.quietCount||0)+' quiet', table(
      [{label:'Member',key:'memberId'},{label:'Why',key:'why',raw:true}],
      (d.quietMembers||[]).map(function(r){ return { memberId:r.memberId, why:'<span class="why">'+r.why+'</span>' }; }),
      'No quiet sample.'
    ));
    html+=section('Friday send sample · '+(d.sendCount||0)+' pending', table(
      [{label:'Member',key:'memberId'},{label:'Why',key:'why',raw:true}],
      (d.sendPending||[]).map(function(r){ return { memberId:r.memberId, why:'<span class="why">'+r.why+'</span>' }; }),
      'No send sample.'
    ));
    html+=section('Source rec', table(
      [{label:'SKU',key:'sku'},{label:'Source',key:'source'},{label:'Left',key:'left',num:true},{label:'Why',key:'why',raw:true}],
      (d.source||[]).map(function(r){ return { sku:r.sku, source:r.source, left:r.leftover, why:'<span class="why">'+r.why+'</span>' }; }),
      'No source picks.'
    ));
    html+=section('Settlements due', table(
      [{label:'Code',key:'code'},{label:'Amount',key:'amount',num:true},{label:'Why',key:'why',raw:true}],
      (d.settlementsDue||[]).map(function(r){ return { code:'<code>'+(r.pickupCode||'-')+'</code>', amount:'Rs '+(r.amount||0), why:'<span class="why">'+r.why+'</span>' }; }),
      'No settlements due.'
    ));
    document.getElementById('root').innerHTML=html;
  }).catch(function(){ document.getElementById('root').textContent='Could not load predict.'; });
}
load();
</script>
</body>
</html>
