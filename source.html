<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F6F8FB">
<title>NiaSave · Who we buy from</title>
<link rel="icon" href="/assets/nia-logo.png" type="image/png">
<link rel="apple-touch-icon" href="/assets/nia-logo.png">
<link rel="stylesheet" href="/staff.css">
</head>
<body>
  <div class="narrow">
    <div class="narrow-card">
      <div class="kicker">Operation Polo</div>
      <h1>Open on a laptop</h1>
      <p>Source is a wide staff desk. It is not the member app.</p>
    </div>
  </div>
  <div class="tower">
    <header class="top">
      <div class="mark">
        <img class="nia-logo" src="/assets/nia-logo.png" alt="Nia">
        <div class="brand">Operation Polo</div>
        <div class="desk-head">
          <svg class="desk-icon" viewBox="0 0 40 40" width="40" height="40" aria-hidden="true"><path d="M8 16h24l-2 16H10L8 16z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M8 20h24M14 16V12h12v4" stroke="currentColor" stroke-width="2"/><path d="M20 24v8M16 28l4 4 4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <h1>Who we buy from</h1>
        </div>
      </div>
      <div class="meta"><a href="/ops.html">Ops</a></div>
    </header>
    <div class="wrap">
      <p class="sub">Procure plus vendors from the Connectors desk · keep a SKU only when Nia cost is under kirana · no live buy</p>
      <p class="sub" id="from">…</p>
      <button type="button" onclick="load()">Refresh</button>
      <div id="wrap" class="empty">Loading…</div>
    </div>
  </div>
<script>
function fromLabel(d){
  var raw=d.from || (d.sheetFrom && d.sheetFrom.procure) || '';
  if(!raw || raw==='No file yet') return 'No file yet';
  var low=String(raw).toLowerCase();
  if(low.indexOf('down')>=0) return 'Sheet down';
  return raw;
}
function load(){
  document.getElementById('wrap').textContent='Loading…';
  fetch('/api/source').then(function(r){ return r.json(); }).then(function(d){
    document.getElementById('from').textContent=(d.theatre||'Rajputana Theatre')+' · 40 stops · 3000 members · '+fromLabel(d);
    var rows=Array.isArray(d)?d:(d.sources||[]);
    if(!rows.length){ document.getElementById('wrap').innerHTML='<div class="empty">No file yet. Choose a procure CSV on the Connectors desk.</div>'; return; }
    document.getElementById('wrap').innerHTML='<table><thead><tr><th>SKU</th><th>Name</th><th>Vendor</th><th>Buy</th><th>Keep</th><th>Lead</th><th>Last buy</th><th>Status</th></tr></thead><tbody>'
      +rows.map(function(r){
        return '<tr><td>'+r.sku+'</td><td class="left">'+(r.name||'-')+'</td><td class="left">'+(r.vendor||r.source||'-')+'</td><td class="num">Rs '+(r.niaCost!=null?r.niaCost:'-')+'</td><td class="num">'+(r.keep!=null?r.keep:'-')+'</td><td>'+(r.lead_days!=null?r.lead_days+'d':'-')+'</td><td>'+(r.last_buy||'-')+'</td><td>'+(r.status||'-')+'</td></tr>';
      }).join('')
      +'</tbody></table>';
  }).catch(function(){ document.getElementById('wrap').textContent='Could not load sources.'; });
}
load();
</script>
</body>
</html>
